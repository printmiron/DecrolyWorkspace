<div class="container p-4">
    <h1 class="color-primary">{{miProducto.title}}</h1>
    <h3>{{miProducto.subtitle}}</h3>
    <hr>

    <div class="container">

        <div class="row">

            <div class="col">
                <img class="border shadow rounded d-block w-100 h-100 " [src]="miProducto.image" />
            </div>

            <div class="col">
                <p>{{miProducto.descripcion}}</p>
                <p>Categoría: {{miProducto.categoria}}</p>
            </div>

        </div>

    </div>
    
</div>
