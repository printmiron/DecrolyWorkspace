<div class="container">

    <!-- recorremos el contenedor dependiendo de cuantos productos se reciben -->
    @for (producto of arrProductos; track $index) {

        <div class="col" >
            <!-- monstramos el card de producto y pasamos el objeto/dato del producto desde padre -->
            <app-card-component [miProducto]="producto"></app-card-component>
        </div>

    }

</div>
