<form #loginForm="ngForm" (ngSubmit)="getUser(loginForm)">

  <div class="form-outline mb-4">
    <input type="text" name="username" ngModel id="form2Example17" class="form-control form-control-lg" required />
    <label class="form-label" for="form2Example17">Usuario</label>
  </div>

  <div class="form-outline mb-4">
    <input type="password" name="password" ngModel id="form2Example27" class="form-control form-control-lg" required />
    <label class="form-label" for="form2Example27">Contraseña</label>
  </div>

  <div class="pt-1 mb-4 d-flex justify-content-center">
    <button class="btn btn-dark btn-lg btn-block me-5" type="button" [routerLink]="['/landingPage']">
      Volver
    </button>

    <button class="btn btn-dark btn-lg btn-block" type="submit">
      Login
    </button>
  </div>

</form>
