<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carrito</title>

    <link rel="stylesheet" href="style.css">
    <!-- BOOTSTRAP CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- BOOTSTRAP ICONS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
</head>

<body>

    <header class="text-black p-5">
        <h1 class="text-center">Carrito de la compra</h1>
    </header>

<div class="container my-5">

    
    <div class="container py-5 border rounded-3 center shadow-lg ">
        <div class="row">

            <div class="col-lg-8">
                <table class="table table-borderless table align-middle">

                    <thead id="headProduct" class="border-bottom">
                        <tr>
                            <th scope="col">Producto</th>
                            <th scope="col">Cantidad</th>
                            <th scope="col">Unidad</th>
                            <th scope="col">Total</th>
                        </tr>
                    </thead>

                    <tbody id="bodyProduct">
                        <!-- añadimos las filas desde js -->
                    </tbody>

                </table>
            </div>


            <div class="col-md-4">

                <div class="container p-3 border rounded-3">

                    <table class="table-borderless table align-middle text-center">

                        <thead id="headTotal">
                            
                        </thead>

                        <tbody>
                            <tr>
                                <th scope="col">Total</th>
                                <th scope="col" id="totalFinal">0€</th>
                            </tr>
                        </tbody>

                    </table>

                </div>

            </div>

        </div>
    </div>
</div>

<!-- <footer>
    <p class="text-center p-3 fixed-bottom">Pavel Miron</p>
</footer> -->
    <script src="./scripts.js" type="module"></script>

</body>

</html>
