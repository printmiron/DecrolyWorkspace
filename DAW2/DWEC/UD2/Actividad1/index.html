<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carrito</title>

    <link rel="stylesheet" href="style.css">
    <!-- BOOTSTRAP CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- BOOTSTRAP ICONS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
</head>

<body>

    <div class="container py-5">
        <div class="row">

            <div class="col-lg-8">
                <table class="table table-borderless table align-middle">

                    <thead id="headProduct" class="border-bottom">
                        <tr>
                            <th scope="col">Producto</th>
                            <th scope="col">Cantidad</th>
                            <th scope="col">Unidad</th>
                            <th scope="col">Total</th>
                        </tr>
                    </thead>

                    <tbody id="bodyProduct">
                        <!-- añadimos las filas desde js -->
                    </tbody>

                </table>
            </div>


            <div class="col-md-4">

                <div class="container">

                    <table class="table-borderless table align-middle $gray-400">

                        <thead class="border-bottom">
                            <tr>
                                <th scope="col">Total</th>
                            </tr>
                        </thead>

                        <tbody>
                            <tr>
                                <th scope="col">Total</th>
                                <th scope="col d-flex justify-content-end" id="totalFinal">0€</th>
                            </tr>
                        </tbody>

                    </table>

                </div>

            </div>

        </div>
    </div>


    <script src="./scripts.js" type="module"></script>

</body>

</html>
