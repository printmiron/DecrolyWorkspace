<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Caja Mir - Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="container-fluid">
    <div class="row">
        <nav id="sidebar" class="col-md-3 col-lg-2 d-md-block sidebar collapse">
            <div class="position-sticky pt-3">
                <div class="text-center mb-4">
                    <img src="img/logo.png" alt="logo" class="img-fluid px-3">
                </div>
                <ul class="nav flex-column">
                    <li class="nav-item">
                        <a class="nav-link active" href="index.html">
                            <i class="bi bi-person-circle me-2"></i>Cuenta
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="404.html">
                            <i class="bi bi-arrow-left-right me-2"></i>Transferencias
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="404.html">
                            <i class="bi bi-graph-up-arrow me-2"></i>Inversiones
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="404.html">
                            <i class="bi bi-credit-card me-2"></i>Tarjetas
                        </a>
                    </li>
                </ul>
            </div>
        </nav>

        <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4">
            <div class="pt-3 pb-2 mb-3 border-bottom">
                <h1 class="h2">Panel de control</h1>
            </div>

            <div class="row g-4">
                <div class="col-sm-6 col-xl-3">
                    <div class="card card-financial shadow-sm">
                        <div class="card-body">
                            <div class="d-flex justify-content-between">
                                <h5>saldo total</h5>
                                <i class="bi bi-wallet2 text-gold"></i>
                            </div>
                            <h2 class="text-gold">45.230€</h2>
                        </div>
                    </div>
                </div>
                <div class="col-sm-6 col-xl-3">
                    <div class="card card-financial shadow-sm">
                        <div class="card-body">
                            <div class="d-flex justify-content-between">
                                <h5>gastos mes</h5>
                                <i class="bi bi-cart-dash text-danger"></i>
                            </div>
                            <h2 class="text-danger">1.240€</h2>
                        </div>
                    </div>
                </div>
                <div class="col-sm-6 col-xl-3">
                    <div class="card card-financial shadow-sm">
                        <div class="card-body">
                            <div class="d-flex justify-content-between">
                                <h5>ibex 35</h5>
                                <i class="bi bi-activity text-success"></i>
                            </div>
                            <h2 class="text-success">+2,4%</h2>
                        </div>
                    </div>
                </div>
                <div class="col-sm-6 col-xl-3">
                    <div class="card card-financial shadow-sm">
                        <div class="card-body">
                            <div class="d-flex justify-content-between">
                                <h5>meta ahorro</h5>
                                <i class="bi bi-gem text-gold"></i>
                            </div>
                            <div class="progress mt-2">
                                <div class="progress-bar bg-gold" style="width: 75%"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>
</div>

<script src="js/bootstrap.bundle.min.js"></script>
</body>
</html>
