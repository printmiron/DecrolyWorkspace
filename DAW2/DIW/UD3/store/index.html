    <header class="header">

    <nav class="navegacion">
        <!-- Creamos los enlaces de la navegacion, he metido aparte los enlaces del boton login -->
        <div class="navegacion__enlaces">
            <a class="navegacion__enlace navegacion__enlace--activo" href="index.html">Tienda</a>
            <a class="navegacion__enlace" href="nosotros.html">Nosotros</a>
        </div>



        <!-- Creamos el boton que si lo pulsamos nos sale el contenedor con id: login  -->
        <button onclick="document.getElementById('login').style.display='block'">Login</button>

        <!-- Contenedor despues de pulsar el boton -->
        <div id="login" class="modal">

            <!-- Contenido del contenedor (el forum), el boton cerrar, datos de usuario y boton crear tienen sus contenedores -->
            <form action="index.html">

                <div class="container animate">

                    <div class="boton-cerrar">
                        <!-- Boton para cerrar el contenedor -->
                        <button onClick="document.getElementById('login').style.display='none'" class="cerrar"
                            title="Cerrar Login">✕</button>
                    </div>

                    <div class="datos-usuario">

                        <div class="login">
                            <label for="login">Usuario</label>
                            <input class="login_style" type="text" placeholder="Introduce el usuario" name="login" required>
                        </div>

                        <div class="contrasena">
                            <label for="contrasena">Contraseña</label>
                            <input class="contrasena_style" type="password" placeholder="Introduce la contraseña" name="contrasena" required>
                            <span toggle="#password-field" class="fa fa-fw fa-eye field-icon toggle-password"></span>
                        </div>

                    </div>

                    <div class="boton-crear">
                        <button class="crear" type="submit">Iniciar sesión</button>
                    </div>
                    

                </div>
            </form>

        </div>

    </nav>
