<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
</head>

<body>

    <!-- contenedor con -> ancho de 50% | un margin top 5 -->
    <div class="container w-50 mt-5">

        <!-- creamos la tabla con bordes de color negro -->
        <!-- .table-striped para agregar rayas de cebra a cualquier fila de la tabla dentro de <tbody> -->
        <table class="table table-striped table-bordered border-dark">

            <!-- cabezera de la tabla -->
            <thead>
                <!-- asignamos el texto al centro y hacemos una fila para todas las columnas -->
                <tr class="text-center">
                    <td colspan="4">Tabla fusionada</td>
                </tr>

            </thead>

            <!-- cuerpo de la tabla -->
            <tbody>

                <tr>
                    <td></td>
                    <!-- asignamos "Media" con la columna de la dercha -->
                    <td colspan="2">Media</td>
                    <!-- asignamos "Ojos rojos" con la fila de abajo -->
                    <td rowspan="2">Ojos rojos</td>
                </tr>

                <tr>
                    <td></td>
                    <td>Altura</td>
                    <td>Peso</td>
                </tr>

                <tr>
                    <th scope="row">Machos</th>
                    <td>1.9</td>
                    <td>0.003</td>
                    <td></td>
                </tr>

                <tr>
                    <th scope="row">Hembras</th>
                    <td>1.7</td>
                    <td>0.002</td>
                    <td></td>
                </tr>

            </tbody>

        </table>

    </div>


</body>

</html>
